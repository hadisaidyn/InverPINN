[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inverpinn"
version = "0.0.0"
description = "Incremental inverse advection-diffusion PINN research project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "xarray>=2024.1",
  "netCDF4>=1.6",
  "scikit-learn>=1.4",
  "PyYAML>=6.0",
  "pyproj>=3.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
